[package]
name = "silex-ui-core"
version = "0.1.0"
edition = "2021"
authors = ["Sagar Kumar Jha <devsagarkumarjha@gmail.com>"]
description = "Core state machines, WCAG color calculators, and design tokens for Silex UI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagarkrjha/silex"
homepage = "https://github.com/sagarkrjha/silex"
documentation = "https://docs.rs/silex-ui-core"
readme = "README.md"
keywords = ["ui", "components", "design-system", "wasm", "state-machine"]
categories = ["gui", "wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
