[package]
name = "silex-cli"
version = "0.1.0"
edition = "2021"
description = "Native Rust CLI for Silex component registry and scaffolding"
authors = ["Silex Team"]

[[bin]]
name = "silex"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
silex-core = { path = "../silex-core" }
