<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Flint Crystal Facet 1 (Obsidian Dark) -->
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Flint Crystal Facet 2 (Slate Medium) -->
    <linearGradient id="facetMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Flint Crystal Facet 3 (Light Slate Highlight) -->
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Ember Spark Accent (Flint Strike Fire) -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="25%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <filter id="emberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="500" rx="90" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="2" y="2" rx="88" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />

  <!-- Silex Monogram Geometric Flint Structure -->
  <g transform="translate(0, 0)">
    <!-- Base Top Left Stone Facet -->
    <polygon points="250,75 375,150 250,225 125,150" fill="url(#facetLight)" />
    
    <!-- Left Flank Facet -->
    <polygon points="125,150 250,225 250,375 125,300" fill="url(#facetDark)" />
    
    <!-- Right Flank Facet -->
    <polygon points="250,225 375,150 375,300 250,375" fill="url(#facetMid)" />

    <!-- Center Cleavage Ridge / Inner Flint Blade 'S' Cut -->
    <path d="M 330,175 L 210,245 L 290,290 L 170,360" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Ember Spark Core (The Flint Spark) -->
    <polygon points="250,195 285,245 250,295 215,245" fill="url(#sparkGrad)" filter="url(#emberGlow)" />
    <circle cx="250" cy="245" r="7" fill="#ffffff" />
  </g>
</svg>
