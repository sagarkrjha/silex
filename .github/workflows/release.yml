name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_cargo:
        description: "Publish to crates.io"
        required: true
        type: boolean
        default: true
      publish_npm:
        description: "Publish to npm registry"
        required: true
        type: boolean
        default: true

jobs:
  test:
    name: Test Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/docs/package-lock.json"

      - name: Run Cargo Tests
        run: cargo test --workspace

      - name: Build Docs Portal
        run: |
          cd apps/docs
          npm ci
          npm run build

      - name: Build Silex UI npm Package
        run: |
          cd packages/silex-ui
          npm install
          npm run build

  publish-cargo:
    name: Publish to Crates.io
    needs: test
    if: github.event_name == 'push' || inputs.publish_cargo == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish silex-ui-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd crates/silex-core
          cargo publish --token "$CARGO_REGISTRY_TOKEN"

      - name: Wait for crates.io index sync
        run: sleep 45

      - name: Publish silex-ui-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd crates/silex-cli
          cargo publish --token "$CARGO_REGISTRY_TOKEN"

  publish-npm:
    name: Publish to npm Registry
    needs: test
    if: github.event_name == 'push' || inputs.publish_npm == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build and Publish silex-ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/silex-ui
          npm install
          npm run build
          npm publish --access public
